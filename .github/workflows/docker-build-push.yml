name: Build and Push Docker Image

on:
  push:
    tags:
      - "*"
  # Manual sandbox deploy of any branch/tag/SHA, without creating a git tag.
  # Builds the chosen ref, publishes the mutable `:sandbox` image, and redeploys
  # the sandbox environment only (never prod, never `:latest`).
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build and deploy to sandbox"
        required: true
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MONGO_URI: "mongodb://mongo:27017"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # On a tag push, github.event.inputs.ref is empty so we fall back to the
          # pushed tag; on a manual dispatch we build the ref the user picked.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Wait for MongoDB to be ready
        shell: bash
        run: |
          # find the mongo container ID (ancestor=mongo:6.0)
          container_id=$(docker ps -qf "ancestor=mongo:6.0")
          until docker exec "$container_id" mongosh --quiet --eval "db.adminCommand({ ping: 1 })"; do
            echo "Waiting for MongoDB to be healthy…"
            sleep 2
          done
          echo "MongoDB is up!"

      - name: Run tests
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Decide which image tags to publish and whether this is a prod release.
      #   - every build moves the mutable `:sandbox` tag (what the sandbox
      #     environment's Source Image tracks), so sandbox always runs the build.
      #   - a manual dispatch also gets a traceable `:sandbox-<sha>` tag and is
      #     never a release.
      #   - a tag push publishes the version tag; a release tag (no '-') also
      #     moves `:latest` (what prod tracks) and flags a prod redeploy.
      - name: Determine image tags
        id: meta
        run: |
          IMAGE=beskar18/book-club-bot
          TAGS="$IMAGE:sandbox"
          IS_RELEASE=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS="$TAGS"$'\n'"$IMAGE:sandbox-${GITHUB_SHA::7}"
          else
            TAGS="$TAGS"$'\n'"$IMAGE:${GITHUB_REF_NAME}"
            if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
              TAGS="$TAGS"$'\n'"$IMAGE:latest"
              IS_RELEASE=true
            fi
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "is_release=$IS_RELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing tags:"
          echo "$TAGS"
          echo "is_release=$IS_RELEASE"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Runs on every build (tag push and manual dispatch). The sandbox service's
      # Source Image tracks `:sandbox`, so the redeploy re-pulls the image just
      # published above. Best-effort: a sandbox hiccup must not fail a release.
      - name: Trigger Railway sandbox redeploy
        continue-on-error: true
        env:
          # Must be an ACCOUNT or WORKSPACE token (sent as Authorization: Bearer).
          # Project tokens use the Project-Access-Token header and CANNOT trigger
          # deploys — they return "Not Authorized".
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          response=$(curl --silent --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Authorization: Bearer $RAILWAY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "query": "mutation serviceInstanceRedeploy($environmentId: String!, $serviceId: String!) { serviceInstanceRedeploy(environmentId: $environmentId, serviceId: $serviceId) }",
              "variables": {
                "environmentId": "dad43f6e-5e42-495f-8c4a-af1c60cab6ee",
                "serviceId": "02e9cc0f-533e-4bf2-bd6f-97651b73d2f9"
              }
            }')
          echo "$response"
          # GraphQL errors come back as HTTP 200, so inspect the body explicitly.
          if echo "$response" | grep -q '"errors"'; then
            echo "::error::Railway redeploy failed"
            exit 1
          fi
          echo "Railway redeploy triggered successfully"

      # Only release tags (no '-') redeploy prod, which tracks `:latest`. Manual
      # dispatches set is_release=false and therefore never touch prod.
      - name: Trigger Railway production redeploy (release tags only)
        if: ${{ steps.meta.outputs.is_release == 'true' }}
        env:
          # Must be an ACCOUNT or WORKSPACE token (sent as Authorization: Bearer).
          # Project tokens use the Project-Access-Token header and CANNOT trigger
          # deploys — they return "Not Authorized".
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Same project & service as sandbox (prod_ environment). Only the
          # environmentId differs from the sandbox redeploy step above.
          response=$(curl --silent --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Authorization: Bearer $RAILWAY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "query": "mutation serviceInstanceRedeploy($environmentId: String!, $serviceId: String!) { serviceInstanceRedeploy(environmentId: $environmentId, serviceId: $serviceId) }",
              "variables": {
                "environmentId": "529502cf-a952-4f64-a38b-596cf3220a54",
                "serviceId": "02e9cc0f-533e-4bf2-bd6f-97651b73d2f9"
              }
            }')
          echo "$response"
          # GraphQL errors come back as HTTP 200, so inspect the body explicitly.
          if echo "$response" | grep -q '"errors"'; then
            echo "::error::Railway production redeploy failed"
            exit 1
          fi
          echo "Railway production redeploy triggered successfully"
